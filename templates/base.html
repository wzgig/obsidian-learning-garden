<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="{{ site.description }}">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'">
  <title>{% block title %}{{ site.name }}{% endblock %}</title>
  <link rel="icon" href="{{ base_url }}assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="{{ base_url }}site.webmanifest">
  <link rel="stylesheet" href="{{ base_url }}assets/styles.css">
</head>
<body data-base-url="{{ base_url }}">
  <a class="skip-link" href="#main">跳到正文</a>
  <div class="ambient-light" aria-hidden="true"></div>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand pressable" href="{{ base_url }}" aria-label="{{ site.name }}首页" translate="no">
        <span class="brand-mark" aria-hidden="true">词</span>
        <span class="brand-copy">
          <strong>{{ site.short_name }}</strong>
          <small>Lexicon Garden</small>
        </span>
      </a>
      <div class="header-actions">
        <nav aria-label="主导航">
          <a href="{{ base_url }}">词汇库</a>
          <a href="{{ base_url }}vocabulary-review.html">复习方法</a>
        </nav>
        <button class="icon-button pressable" type="button" data-theme-toggle aria-label="切换深浅色主题" title="切换深浅色主题">
          <span class="theme-icon" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div>
      <strong>{{ site.short_name }} · Lexicon Garden</strong>
      <p>把真实阅读中的偶遇，整理成可检索、可复习、可调用的语言。</p>
    </div>
    <p>公开学习子集 · 私有 Vault 不参与网页构建</p>
  </footer>
  <script src="{{ base_url }}assets/app.js" defer></script>
</body>
</html>
